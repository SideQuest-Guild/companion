[package]
name = "sidequest-companion"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "SideQuest Companion: syncs the SideQuest WoW addon with sidequest-guild.com from your system tray"
license = "MIT"
repository = "https://github.com/SideQuest-Guild/companion"
homepage = "https://sidequest-guild.com"
publish = false

[[bin]]
name = "sidequest-companion"
path = "src/main.rs"

[lib]
name = "sidequest_companion"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "charset", "system-proxy"] }
url = "2"
semver = "1"
sha2 = "0.11"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"
directories = "6"
keyring = "4"
notify = "8"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
self-replace = "1"
open = "5"
# UI
gpui-kit = "0.8.1"
gpui-tray = { version = "0.3", default-features = false, features = ["gpui-kit", "menu-state"] }
rust-embed = { version = "8.7", features = ["include-exclude"] }
png = "0.17"
notify-rust = "4"
auto-launch = "0.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
wiremock = "0.6"
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
